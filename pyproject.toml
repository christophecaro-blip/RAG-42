[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "RAG system answering questions about the vLLM codebase."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.3.16",
    "chonkie[code]>=1.7.0",
    "fire>=0.7.1",
    "pydantic>=2.14.2",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false

[tool.mypy]
exclude = ["data/", "data\\+moulinette/"]

[[tool.mypy.overrides]]
module = ["fire", "bm25s.*", "chonkie.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "types-tqdm>=4.70.0.20261102",
]
